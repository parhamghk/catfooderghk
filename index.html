<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Servo Control</title>

  <style>
    :root {
      --bg: #0f172a;
      --panel: #020617;
      --panelBorder: #1f2937;
      --status: #111827;
      --green: #16a34a;
      --text: #fff;
    }

    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 14px;
    }

    .card {
      background: var(--panel);
      padding: 22px 20px;
      border-radius: 18px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 18px 32px rgba(0,0,0,.35);
      text-align: center;
    }

    h2 { margin: 0 0 12px 0; font-size: 1.4rem; }

    button {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: var(--green);
      color: white;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 6px;
      transition: transform .1s, opacity .1s;
    }

    button:active { transform: scale(.97); }
    button:hover { opacity: .9; }

    .status {
      margin-top: 14px;
      padding: 12px;
      border-radius: 12px;
      background: var(--status);
      border: 1px solid var(--panelBorder);
      font-size: .95rem;
      min-height: 36px;
      line-height: 1.35;
    }

    @media (max-width: 380px) {
      h2 { font-size: 1.2rem; }
      button { font-size: .95rem; }
      .card { padding: 18px 16px; }
    }
  </style>
</head>

<body>
  <div class="card">
    <h2>Servo Controller</h2>

    <button onclick="openServo()">OPEN</button>

    <div class="status" id="statusBox">
      Status: waiting…
    </div>
  </div>

  <!-- MQTT.js -->
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <script>
    // HiveMQ broker WebSocket URL
    const broker = "wss://4ca927b09a494f7896d0d9cb3bd79294.s1.eu.hivemq.cloud:8884/mqtt";
    const options = {
      username: "catfeederweb",   // HiveMQ username
      password: "Web_ghk123"       // HiveMQ password
    };

    // Connect to MQTT broker
    const client = mqtt.connect(broker, options);

    client.on("connect", function() {
      console.log("Connected to HiveMQ WebSocket broker");
      document.getElementById("statusBox").textContent = "Status: Connected to MQTT ✅";
    });

    client.on("error", function(err) {
      console.error("MQTT connection error:", err);
      document.getElementById("statusBox").textContent = "Status: MQTT Error ⚠️";
    });

    function openServo() {
      const box = document.getElementById("statusBox");
      box.textContent = "Sending command…";

      if (client.connected) {
        client.publish("catfeeder/servo", "OPEN");
        box.textContent = "Status: OPENED ✅";
      } else {
        box.textContent = "Status: MQTT not connected ⚠️";
      }
    }
  </script>
</body>
</html>
